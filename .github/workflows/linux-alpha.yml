name: Linux Alpha

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux-alpha:
    runs-on: ubuntu-latest
    # The per-phase wall/RSS ceilings remain authoritative. This outer timeout
    # only leaves enough room for every bounded phase plus runner overhead.
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      # Keep one composed job: splitting these phases would rebuild the same
      # stage1/proof/release artifacts in multiple runners.
      - name: Run budgeted milestone gate
        run: scripts/check_milestone.sh
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-alpha-verification
          path: build/verification/*.json
          if-no-files-found: warn
