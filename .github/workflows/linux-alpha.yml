name: Linux Alpha

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux-alpha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bootstrap dependencies
        run: python3 scripts/setup_deps.py
      - name: Run Linux alpha gate
        run: scripts/check_linux_alpha.sh
